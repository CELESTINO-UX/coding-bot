<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCode Bot · command runner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 20px; display: grid; place-items: center;
      background: #1e1e1e; color: #d4d4d4;
      font-family: 'Segoe UI', sans-serif;
    }
    .app {
      width: min(900px, 100%); overflow: hidden; border: 1px solid #3e3e42;
      border-radius: 12px; background: #252526;
      box-shadow: 0 20px 40px #0009;
    }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #2d2d2d; border-bottom: 1px solid #3c3c3c; }
    .dots { display: flex; gap: 7px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .red { background: #fe5f57; } .yellow { background: #febc2e; } .green { background: #28c840; }
    header strong { font-size: 14px; font-weight: 500; }
    .badge { margin-left: auto; padding: 3px 9px; border-radius: 20px; background: #3a3a3a; color: #9cdcfe; font-size: 11px; }
    main { padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 500; }
    .intro, .help { color: #aaa; font-size: 14px; line-height: 1.6; }
    .intro { margin: 0 0 20px; }
    label { display: block; margin-bottom: 8px; color: #ccc; font-size: 13px; font-weight: 600; }
    .input-row { display: flex; gap: 10px; }
    #commandInput {
      flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid #3c3c3c; border-radius: 6px;
      outline: none; background: #1e1e1e; color: #f1f1f1; font: 15px 'Consolas', monospace;
    }
    #commandInput:focus { border-color: #007acc; box-shadow: 0 0 0 2px #007acc33; }
    button { border: 0; border-radius: 6px; background: #0e639c; color: white; padding: 0 20px; font-size: 14px; cursor: pointer; }
    button:hover { background: #1177bb; } button:disabled { opacity: .65; cursor: wait; }
    .help { margin: 12px 0 22px; }
    .help code { color: #9cdcfe; }
    .status { min-height: 20px; margin-bottom: 8px; color: #9cdcfe; font-size: 13px; }
    .console-wrap { border-top: 1px solid #3c3c3c; padding-top: 18px; }
    .console-title { margin-bottom: 10px; color: #ccc; font-size: 12px; font-weight: 600; letter-spacing: .7px; }
    #output { min-height: 150px; max-height: 300px; overflow-y: auto; padding: 14px 16px; border: 1px solid #2d2d2d; border-radius: 8px; background: #0c0c0c; font: 13px/1.7 'Consolas', monospace; }
    .line { display: flex; gap: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .prompt { color: #569cd6; } .command { color: #6a9955; } .result { color: #b5cea8; } .error { color: #f48771; }
    @media (max-width: 560px) { main { padding: 18px; } .input-row { flex-direction: column; } button { min-height: 42px; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="dots" aria-hidden="true"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
      <strong>⚡ AutoCode Bot</strong><span class="badge">COMMAND MODE</span>
    </header>
    <main>
      <h1>Give the bot a command</h1>
      <p class="intro">Write what you want the bot to do, then press <b>Run command</b> or Enter.</p>
      <label for="commandInput">Your command</label>
      <div class="input-row">
        <input id="commandInput" type="text" placeholder="Try: add 12 and 8, say hello, or what time is it" autocomplete="off" spellcheck="false">
        <button id="runButton" type="button">▶ Run command</button>
      </div>
      <p class="help">Try <code>help</code>, <code>say hello</code>, <code>add 12 and 8</code>, <code>what time is it</code>, or <code>2 + 2</code>.</p>
      <div class="status" id="status" role="status" aria-live="polite">🤖 Ready for a command.</div>
      <section class="console-wrap" aria-label="Command output">
        <div class="console-title">📋 OUTPUT</div>
        <div id="output" role="log" aria-live="polite">
          <div class="line"><span class="prompt">➜</span><span class="result">Welcome! Type <b>help</b> to see available commands.</span></div>
        </div>
      </section>
    </main>
  </div>
  <script>
    (() => {
      const input = document.getElementById('commandInput');
      const button = document.getElementById('runButton');
      const output = document.getElementById('output');
      const status = document.getElementById('status');

      function printLine(text, kind = 'result') {
        const line = document.createElement('div');
        line.className = 'line';
        const prompt = document.createElement('span');
        prompt.className = 'prompt';
        prompt.textContent = '➜';
        const message = document.createElement('span');
        message.className = kind;
        message.textContent = text;
        line.append(prompt, message);
        output.appendChild(line);
        output.scrollTop = output.scrollHeight;
      }

      function runCommand() {
        const command = input.value.trim();
        if (!command) {
          status.textContent = 'Type a command first.';
          input.focus();
          return;
        }
        printLine('> ' + command, 'command');
        button.disabled = true;
        status.textContent = '🤖 Working...';

        window.setTimeout(() => {
          try {
            const normalized = command.toLowerCase();
            let response;

            if (/^(help|\?)$/.test(normalized)) {
              response = 'Commands: say <text>, add <number> and <number>, what time is it, clear, or a simple calculation like 2 + 2.';
            } else if (normalized === 'clear' || normalized === 'clear output') {
              output.replaceChildren();
              response = 'Output cleared.';
            } else if (/^(say|print|echo)\s+.+/i.test(command)) {
              response = command.replace(/^(say|print|echo)\s+/i, '');
            } else if (/^(what time is it|time|current time)$/i.test(command)) {
              response = new Date().toLocaleString();
            } else {
              const addCommand = normalized.match(/^add\s+(-?\d+(?:\.\d+)?)\s+(?:and|to|\+)\s+(-?\d+(?:\.\d+)?)$/);
              const calculation = command.match(/^\s*(-?\d+(?:\.\d+)?)\s*([+*/-])\s*(-?\d+(?:\.\d+)?)\s*$/);
              const match = addCommand || calculation;
              if (match) {
                const left = Number(match[1]);
                const right = Number(match[2]);
                const operator = addCommand ? '+' : calculation[2];
                if (operator === '/' && right === 0) throw new Error('Cannot divide by zero.');
                const value = operator === '+' ? left + right : operator === '-' ? left - right : operator === '*' ? left * right : left / right;
                response = String(value);
              } else {
                throw new Error('I do not know that command yet. Type "help" to see what I can do.');
              }
            }
            printLine(response);
            status.textContent = '🤖 Command completed.';
          } catch (error) {
            printLine(error.message, 'error');
            status.textContent = '🤖 Could not complete that command.';
          } finally {
            button.disabled = false;
            input.focus();
          }
        }, 120);
      }

      button.addEventListener('click', runCommand);
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') runCommand();
      });
      input.focus();
    })();
  </script>
</body>
</html>
